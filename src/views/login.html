<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - FastWork</title>
  <link rel="shortcut icon" href="../public/images/Logo_FAVICON.png" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body {
      background:
        radial-gradient(circle at top, rgba(13, 110, 253, 0.22), transparent 28%),
        linear-gradient(180deg, #050505 0%, #0d1117 100%);
      min-height: 100vh;
    }
  </style>
</head>

<body class="text-light">
  <nav class="navbar navbar-dark navbar-expand-lg bg-black border-bottom border-primary">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="../../index.html">
        <img src="../public/images/Logo_FAVICON.png" width="40" alt="Logo FastWork" />
        <span class="fw-bold fs-4">FastWork</span>
      </a>
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <a class="nav-link text-white-50 p-0" href="../../index.html">Início</a>
        <a class="nav-link active p-0" href="login.html">Entrar</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-xl-5">
        <div class="text-center mb-4">
          <p class="text-primary text-uppercase fw-semibold mb-2">Acesso</p>
          <h1 class="display-6 fw-bold mb-2">Entre na sua conta</h1>
          <p class="text-white-50 mb-0">Use uma conta de teste ou entre com seus dados cadastrados.</p>
        </div>

        <div id="cardLogin" class="card bg-black border-primary shadow-lg">
          <div class="card-body p-4 p-md-5">
            <div id="alertaErro" class="alert alert-danger d-none"></div>
            <div id="alertaSucesso" class="alert alert-success d-none"></div>

            <div class="btn-group w-100 mb-4" role="group">
              <input type="radio" class="btn-check" name="tipo" id="tipoProfissional" checked>
              <label class="btn btn-outline-primary" for="tipoProfissional">
                <i class="bi bi-person-fill"></i> Profissional
              </label>
              <input type="radio" class="btn-check" name="tipo" id="tipoEmpresa">
              <label class="btn btn-outline-primary" for="tipoEmpresa">
                <i class="bi bi-building"></i> Empresa
              </label>
            </div>

            <form id="formLogin" class="needs-validation" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" required placeholder="Digite seu e-mail" />
                <div class="invalid-feedback">Informe um e-mail válido.</div>
              </div>
              <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" required placeholder="Digite sua senha" />
                <div class="invalid-feedback">Informe sua senha.</div>
              </div>
              <button type="submit" class="btn btn-primary w-100 btn-lg mb-4">
                <i class="bi bi-box-arrow-in-right"></i> Entrar
              </button>
            </form>

            <div class="border border-primary rounded-3 p-3 mb-4">
              <h2 class="h6 text-primary mb-3"><i class="bi bi-key-fill"></i> Contas de teste</h2>
              <div id="contasTeste"></div>
              <p class="small text-white-50 text-center mb-0 mt-2">Clique em uma conta para preencher automaticamente
              </p>
            </div>

            <p class="text-center mb-0">
              Ainda não tem conta?
              <a id="linkCadastro" href="formu.html" class="text-primary">Cadastre-se como Profissional</a>
            </p>
          </div>
        </div>

        <div id="cardPerfil" class="card bg-black border-primary shadow-lg d-none mt-4">
          <div class="card-body p-4 p-md-5 text-center">
            <div class="bg-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
              style="width:70px; height:70px; font-size:1.5rem;" id="avatarPerfil"></div>
            <h2 class="h4 mb-1" id="nomePerfil"></h2>
            <p class="text-white-50 mb-4" id="tipoPerfil"></p>
            <ul class="list-group list-group-flush text-start mb-4" id="infoPerfil"></ul>
            <button class="btn btn-outline-light w-100" onclick="sair()">
              <i class="bi bi-box-arrow-right"></i> Sair
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const STORAGE_KEY = "fastwork_users";
    const SESSION_KEY = "fastwork_session";

    // Contas de exemplo, criadas só na primeira vez que a página roda
    function seedDB() {
      if (localStorage.getItem(STORAGE_KEY)) return;
      const exemplo = {
        profissionais: [
          { id: 1, nome: "João Silva", email: "joao@email.com", senha: "123456", profissao: "Pedreiro", telefone: "(11) 98765-4321" },
        ],
        empresas: [
          { id: 1, nomeFantasia: "ABC Construções", email: "contato@abc.com", senha: "123456", cnpj: "12.345.678/0001-90" },
        ],
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(exemplo));
    }

    function getDB() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { profissionais: [], empresas: [] };
    }

    function tipoSelecionado() {
      return document.getElementById("tipoEmpresa").checked ? "empresa" : "profissional";
    }

    function mostrarContasTeste() {
      const tipo = tipoSelecionado();
      const lista = tipo === "empresa" ? getDB().empresas : getDB().profissionais;
      const container = document.getElementById("contasTeste");

      if (!lista.length) {
        container.innerHTML = `<p class="small text-warning mb-0">Nenhuma conta cadastrada ainda.</p>`;
        return;
      }

      container.innerHTML = lista.map(u => `
        <button type="button" class="list-group-item list-group-item-action bg-black text-light border-primary mb-2"
          onclick="preencherLogin('${u.email}', '${u.senha}')">
          <strong>${u.nome || u.nomeFantasia}</strong><br>
          <span class="small text-white-50">${u.email} · senha: ${u.senha}</span>
        </button>
      `).join("");
    }

    function preencherLogin(email, senha) {
      document.getElementById("email").value = email;
      document.getElementById("senha").value = senha;
    }

    function mostrarAlerta(tipo, msg) {
      const id = tipo === "sucesso" ? "alertaSucesso" : "alertaErro";
      const outroId = tipo === "sucesso" ? "alertaErro" : "alertaSucesso";
      document.getElementById(outroId).classList.add("d-none");
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.remove("d-none");
    }

    function exibirPerfil(user, tipo) {
      document.getElementById("cardLogin").classList.add("d-none");
      document.getElementById("cardPerfil").classList.remove("d-none");

      const nomeExibido = user.nome || user.nomeFantasia;
      document.getElementById("avatarPerfil").textContent = nomeExibido.charAt(0).toUpperCase();
      document.getElementById("nomePerfil").textContent = nomeExibido;
      document.getElementById("tipoPerfil").textContent = tipo === "empresa" ? "Empresa" : "Profissional";

      const campos = tipo === "empresa"
        ? [["E-mail", user.email], ["CNPJ", user.cnpj]]
        : [["E-mail", user.email], ["Profissão", user.profissao], ["Telefone", user.telefone]];

      document.getElementById("infoPerfil").innerHTML = campos
        .filter(([, valor]) => valor)
        .map(([label, valor]) => `<li class="list-group-item bg-black text-light border-primary d-flex justify-content-between">
            <span class="text-white-50">${label}</span><span>${valor}</span>
          </li>`).join("");
    }

    function sair() {
      localStorage.removeItem(SESSION_KEY);
      document.getElementById("cardPerfil").classList.add("d-none");
      document.getElementById("cardLogin").classList.remove("d-none");
    }

    document.addEventListener("DOMContentLoaded", () => {
      seedDB();
      mostrarContasTeste();

      document.querySelectorAll('input[name="tipo"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          mostrarContasTeste();
          const link = document.getElementById("linkCadastro");
          if (tipoSelecionado() === "empresa") {
            link.href = "cadastroem.html";
            link.textContent = "Cadastre-se como Empresa";
          } else {
            link.href = "formu.html";
            link.textContent = "Cadastre-se como Profissional";
          }
        });
      });

      const sessao = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
      if (sessao) exibirPerfil(sessao.user, sessao.tipo);
    });

    document.getElementById("formLogin").addEventListener("submit", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const form = e.target;

      if (!form.checkValidity()) {
        form.classList.add("was-validated");
        return;
      }

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const tipo = tipoSelecionado();
      const lista = tipo === "empresa" ? getDB().empresas : getDB().profissionais;
      const user = lista.find((u) => u.email === email && u.senha === senha);

      if (!user) {
        mostrarAlerta("erro", "E-mail ou senha incorretos.");
        return;
      }

      localStorage.setItem(SESSION_KEY, JSON.stringify({ user, tipo }));
      mostrarAlerta("sucesso", "Login realizado com sucesso!");
      setTimeout(() => exibirPerfil(user, tipo), 400);
    });
  </script>
</body>

</html>
